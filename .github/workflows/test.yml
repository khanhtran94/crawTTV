name: Wake Up and Health Check

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ checkHealth ]
  schedule:
    - cron: '*/10 * * * *'

jobs:
  check-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Check Endpoint
        run: |
          URL="https://learn-english-co7q.onrender.com/health"
          echo "Đang kiểm tra: $URL"

          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 --retry 3 --retry-delay 10 "$URL")
          echo "HTTP Status Code: $response"

          if [ "$response" -eq 200 ]; then
            echo "✅ Ứng dụng hoạt động bình thường!"
          else
            echo "❌ Lỗi: mã $response"
            exit 1
          fi